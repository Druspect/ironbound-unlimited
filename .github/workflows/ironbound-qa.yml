name: Ironbound QA

on:
  push:
    branches:
      - gpt/qa-hardening-six-pack
  pull_request:
    branches:
      - sites-source

permissions:
  contents: read

concurrency:
  group: ironbound-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Unit, contract, build, and lint suite
        run: |
          npm test
          npm run lint

      - name: Install browser test runner without changing the lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: External Chromium journeys, visual regression, and budgets
        run: npx playwright test

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironbound-browser-qa
          if-no-files-found: warn
          retention-days: 14
          path: |
            qa-artifacts/
            qa/browser/snapshots/
