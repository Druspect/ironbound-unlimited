name: Temporary brake telemetry patch

on:
  push:
    branches:
      - gpt/production-remediation-four-pack

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/production-remediation-four-pack
      - name: Apply brake telemetry patch
        run: python tools/patch_brake_qa_telemetry.py
      - name: Verify patch
        run: git diff --check
      - name: Commit telemetry repair
        run: |
          git config user.name "Dolostone AI"
          git config user.email "22435112+Druspect@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "qa: expose brake telemetry outside React render"
          git push origin HEAD:gpt/production-remediation-four-pack
