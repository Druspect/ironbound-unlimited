name: Temporary save cadence patch

on:
  push:
    branches:
      - gpt/production-remediation-four-pack

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/production-remediation-four-pack
      - name: Apply save cadence patch
        run: python tools/patch_production_save_cadence.py
      - name: Verify patch
        run: git diff --check
      - name: Commit save cadence fix
        run: |
          git config user.name "Dolostone AI"
          git config user.email "22435112+Druspect@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "state: persist moving runs on a reliable cadence"
          git push origin HEAD:gpt/production-remediation-four-pack
