name: Temporary production remediation patch

on:
  push:
    branches:
      - gpt/production-remediation-four-pack

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/production-remediation-four-pack
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Persist live brake state through saves
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/page.tsx')
          text = path.read_text()

          old = 'brakeEngaged?: boolean; fuel?: number; coal?: number; water?: number;'
          new = 'brakeEngaged?: boolean; brakePressure?: number; brakeCylinderPressure?: number; fuel?: number; coal?: number; water?: number;'
          assert old in text, 'save run type anchor missing'
          text = text.replace(old, new, 1)

          pattern = re.compile(
              r'(?P<i>^[ \t]+)servicedStationRef\.current = Math\.max\(-1, Math\.floor\(finiteOr\(parsed\.run\.servicedStationSequence, -1\)\)\);\n'
              r'(?P=i)brakeRef\.current = parsed\.run\.brakeEngaged !== false;\n'
              r'(?P=i)steamResourcesRef\.current = restoredResources;',
              re.MULTILINE,
          )
          replacement = (
              r'\g<i>servicedStationRef.current = Math.max(-1, Math.floor(finiteOr(parsed.run.servicedStationSequence, -1)));\n'
              r'\g<i>const restoredBrakeEngaged = parsed.run.brakeEngaged !== false;\n'
              r'\g<i>const restoredBrakePressure = clamp(\n'
              r'\g<i>  finiteOr(parsed.run.brakePressure, restoredBrakeEngaged ? 1 : 0),\n'
              r'\g<i>  0,\n'
              r'\g<i>  1,\n'
              r'\g<i>);\n'
              r'\g<i>const restoredBrakeCylinderPressure = clamp(\n'
              r'\g<i>  finiteOr(parsed.run.brakeCylinderPressure, restoredBrakePressure),\n'
              r'\g<i>  0,\n'
              r'\g<i>  1,\n'
              r'\g<i>);\n'
              r'\g<i>brakeRef.current = restoredBrakeEngaged;\n'
              r'\g<i>brakePressureRef.current = restoredBrakePressure;\n'
              r'\g<i>brakeCylinderPressureRef.current = restoredBrakeCylinderPressure;\n'
              r'\g<i>steamResourcesRef.current = restoredResources;'
          )
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, 'brake restore anchor missing'

          pattern = re.compile(
              r'(?P<i>^[ \t]+)setDistance\(restoredDistance\);\n'
              r'(?P=i)setBrakeEngaged\(brakeRef\.current\);\n'
              r'(?P=i)setSteamResources\(restoredResources\);',
              re.MULTILINE,
          )
          replacement = (
              r'\g<i>setDistance(restoredDistance);\n'
              r'\g<i>setBrakeEngaged(restoredBrakeEngaged);\n'
              r'\g<i>setBrakePressure(restoredBrakePressure);\n'
              r'\g<i>setSteamResources(restoredResources);'
          )
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, 'brake restore state anchor missing'

          pattern = re.compile(
              r'(?P<i>^[ \t]+)visualTravel: visualTravelRef\.current,\n'
              r'(?P=i)brakeEngaged,\n'
              r'(?P=i)fuel: steamResources\.fuel,',
              re.MULTILINE,
          )
          replacement = (
              r'\g<i>visualTravel: visualTravelRef.current,\n'
              r'\g<i>brakeEngaged,\n'
              r'\g<i>brakePressure: brakePressureRef.current,\n'
              r'\g<i>brakeCylinderPressure: brakeCylinderPressureRef.current,\n'
              r'\g<i>fuel: steamResources.fuel,'
          )
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, 'brake save anchor missing'

          pattern = re.compile(
              r'(?P<i>^[ \t]+)aria-label=\{brakeEngaged \? "Release train brake" : "Apply train brake"\}\n'
              r'(?P=i)aria-pressed=\{brakeEngaged\}\n'
              r'(?P=i)onClick=\{brake\}',
              re.MULTILINE,
          )
          replacement = (
              r'\g<i>aria-label={brakeEngaged ? "Release train brake" : "Apply train brake"}\n'
              r'\g<i>aria-pressed={brakeEngaged}\n'
              r'\g<i>data-brake-line-pressure={brakePressure.toFixed(4)}\n'
              r'\g<i>data-brake-cylinder-pressure={brakeCylinderPressureRef.current.toFixed(4)}\n'
              r'\g<i>onClick={brake}'
          )
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, 'brake button telemetry anchor missing'

          path.write_text(text)
          PY
          git diff --check
      - name: Commit patched runtime
        run: |
          git config user.name "Dolostone AI"
          git config user.email "22435112+Druspect@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "state: preserve live brake pressure across reloads"
          git push origin HEAD:gpt/production-remediation-four-pack
